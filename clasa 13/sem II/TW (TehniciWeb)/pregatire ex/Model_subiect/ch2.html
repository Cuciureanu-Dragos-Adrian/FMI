<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        .dreptunghi{
            height: 100px;
            width: 50px;
            margin-left: 10px;
            border: 2px black solid;
            background-color: green;
            display: inline-block;
        }
    </style>

    <script>
        window.onload=function(){
            for(let i=0;i<10;i++)
            {
                var dr = document.createElement("div");
                dr.innerHTML="div "+(i+1);

                dr.className="dreptunghi";

                document.body.appendChild(dr);

                var height = parseInt(window.getComputedStyle(dr).height);
                dr.style.height = height + 0 + "px";

                dr.onclick=function(){
                    this.style.height = parseInt(this.style.height) + 10 + "px";

                    event.stopPropagation();
                }
            }

            document.body.onclick=function(){
                var dreptunghiuri = document.getElementsByClassName("dreptunghi");

                for(d of dreptunghiuri){
                    d.style.height = height + "px";
                }
            }
        }
    </script>

</head>
<body>
    
</body>
</html>
