<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            height: 50vh;
            width: 250px;
            border: 2px blue dotted;
            display: grid;
            grid-template-columns: auto auto auto;
            grid-template-rows: auto auto auto;
        }
        .container>div{
            border: 8px black double;
            font-size: 15px;
        }
        div:nth-child(1){
            grid-column: 1/2;
            grid-row: 2/3;
        }
        div:nth-child(2){
            grid-column: 2/3;
            grid-row: 1/2;
        }
        div:nth-child(3){
            grid-column: 2/3;
            grid-row: 2/3;
        }
        div:nth-child(4){
            grid-column: 2/3;
            grid-row: 3/4;
        }
        div:nth-child(5){
            grid-column: 3/4;
            grid-row: 1/4;
        }

        @media screen and (max-width:600px) and (max-height:500px)
        {
            .container{
                display: block;
            }
            .container>div:hover{
                font-size: 30px;
                transition: 3s;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div>1</div>
        <div>2</div>
        <div>3</div>
        <div>4</div>
        <div>5</div>
    </div>
</body>
</html>
