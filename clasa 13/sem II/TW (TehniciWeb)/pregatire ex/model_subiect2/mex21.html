<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

<style>
    #parinte{
        width: 75%;
        height: 50vh;
        border: 3px black solid;
        display: grid;
        grid-template-columns: auto auto auto auto;
        grid-template-rows: auto auto;
    }

    #parinte>div{
        border: 3px blue double;
    }

    #parinte>div:nth-of-type(2n+1){
        background-color: yellow;
    }

    #parinte>div:nth-of-type(2n){
        background-color: orange;
    }

    div:nth-child(1){
        grid-column: 1/2;
        grid-row: 1/2;
    }

    div:nth-child(2){
        grid-column: 2/3;
        grid-row: 1/2;
    }

    div:nth-child(3){
        grid-column: 3/4;
        grid-row: 1/2;
    }

    div:nth-child(4){
        grid-column: 4/5;
        grid-row: 1/2;
    }

    #parinte>div:hover{
        background-color: red;
        transition: 2s;
    }

    @media screen and (min-width:400px) and (max-width:700px){
        #parinte>div{
            border: none;
        }

        div:nth-child(1){
            grid-column: 1/3;
            grid-row: 1/2;
        }

        div:nth-child(2){
            grid-column: 3/5;
            grid-row: 1/2;
        }

        div:nth-child(3){
            grid-column: 1/3;
            grid-row: 2/3;
        }

        div:nth-child(4){
            grid-column: 3/5;
            grid-row: 2/3;
        }
    }

</style>

</head>
<body>
    <div id="parinte">
        <div>1</div>
        <div>2</div>
        <div>3</div>
        <div>4</div>

    </div>
</body>
</html>
